[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aixphysics"
version = "0.1.0"
description = "AI meets physics experiments and simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
aixphysics = "aixphysics.cli:main"

[tool.setuptools]
packages = ["aixphysics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
